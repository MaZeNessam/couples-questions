<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8fb">
  <meta name="description" content="أسئلة لطيفة وممتعة تقرّبكم من بعض. اختاروا تصنيف وابدأوا اللعب سوا.">
  <title>بيننا | أسئلة للكابلز</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #36263e;
      --muted: #85788d;
      --pink: #d94f83;
      --pink-dark: #bd3c70;
      --pink-soft: #fff0f5;
      --purple: #7457a6;
      --line: #eee4eb;
      --surface: rgba(255, 255, 255, .92);
      --shadow: 0 26px 80px rgba(72, 43, 69, .12);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 26px 20px 48px;
      color: var(--ink);
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      background:
        radial-gradient(ellipse at 7% 8%, rgba(255, 201, 222, .48), transparent 29rem),
        radial-gradient(ellipse at 93% 76%, rgba(220, 211, 255, .42), transparent 33rem),
        linear-gradient(145deg, #fffafd, #fff7fa 55%, #fbf8ff);
    }

    button { font: inherit; }

    .page { width: min(100%, 880px); margin: 0 auto; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 54px;
    }

    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; }
    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 15px;
      color: white;
      background: linear-gradient(145deg, #ed78a1, #c84f89);
      box-shadow: 0 8px 20px rgba(217, 79, 131, .24);
      font-size: 20px;
    }
    .brand-name { font-size: 17px; letter-spacing: -.3px; }
    .top-note { color: var(--muted); font-size: 13px; }

    .intro { margin-bottom: 31px; text-align: center; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 13px;
      padding: 8px 13px;
      border: 1px solid #f5dce7;
      border-radius: 99px;
      color: var(--pink-dark);
      background: rgba(255, 255, 255, .82);
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 5px 18px rgba(146, 83, 117, .06);
    }
    h1 { margin: 0; font-size: clamp(32px, 6vw, 52px); letter-spacing: -1.8px; line-height: 1.2; }
    .intro p { margin: 13px 0 0; color: var(--muted); font-size: 16px; line-height: 1.8; }
    .intro-stats {
      display: flex;
      justify-content: center;
      gap: 9px;
      margin-top: 19px;
    }
    .intro-stat {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 12px;
      border: 1px solid rgba(238, 228, 235, .88);
      border-radius: 99px;
      color: #66576d;
      background: rgba(255, 255, 255, .7);
      font-size: 12px;
    }
    .intro-stat strong { color: var(--pink-dark); font-size: 13px; }

    .game {
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .95);
      border-radius: 30px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }
    .game::before {
      display: block;
      height: 4px;
      content: "";
      background: linear-gradient(90deg, #b39ae5, #e989ad 48%, #f3bb9b);
    }

    .categories { padding: 25px 30px 23px; border-bottom: 1px solid var(--line); }
    .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .section-heading h2 { margin: 0; font-size: 15px; }
    .section-heading span { color: var(--muted); font-size: 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 16px; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 99px;
      color: #695b70;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
      transition: color .18s, background .18s, border-color .18s, transform .18s, box-shadow .18s;
    }
    .chip:hover { transform: translateY(-1px); border-color: #e8bdd0; }
    .chip[aria-pressed="true"] {
      border-color: var(--pink);
      color: white;
      background: linear-gradient(135deg, #e86f99, #ce4e85);
      box-shadow: 0 6px 15px rgba(217, 79, 131, .2);
    }
    .chip-count {
      min-width: 21px;
      padding: 2px 5px;
      border-radius: 99px;
      color: #927e94;
      background: #f7f2f6;
      font-size: 10px;
      text-align: center;
    }
    .chip[aria-pressed="true"] .chip-count { color: #fff; background: rgba(255, 255, 255, .2); }

    .question-area { padding: 37px 38px 31px; text-align: center; }
    .question-meta { display: flex; align-items: center; justify-content: center; gap: 9px; min-height: 28px; }
    .category-label {
      padding: 6px 11px;
      border-radius: 99px;
      color: var(--purple);
      background: #f3efff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .1px;
    }
    .progress { color: var(--muted); font-size: 12px; }
    .heart {
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      margin: 17px auto 8px;
      border: 1px solid #f6e3eb;
      border-radius: 17px;
      color: #df739a;
      background: linear-gradient(145deg, #fff6f9, #fff);
      box-shadow: 0 7px 20px rgba(186, 107, 141, .09);
      font-size: 23px;
    }
    .question {
      max-width: 660px;
      min-height: 112px;
      display: grid;
      place-items: center;
      margin: 0 auto;
      font-size: clamp(23px, 4.4vw, 34px);
      font-weight: 750;
      letter-spacing: -.65px;
      line-height: 1.7;
    }
    .prompt { margin: 7px 0 25px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .button {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 18px;
      border: 1px solid transparent;
      border-radius: 14px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      transition: transform .18s, box-shadow .18s, background .18s, border-color .18s;
    }
    .button:hover { transform: translateY(-2px); }
    .button:focus-visible, .chip:focus-visible { outline: 3px solid #dca8c0; outline-offset: 3px; }
    .button-primary {
      color: white;
      background: linear-gradient(135deg, #e86f99, #ce4e85);
      box-shadow: 0 9px 20px rgba(217, 79, 131, .2);
    }
    .button-primary:hover { box-shadow: 0 12px 24px rgba(217, 79, 131, .3); }
    .button-secondary { border-color: var(--line); color: #5d4f64; background: white; }
    .button-secondary:hover { border-color: #e5c4d4; background: #fffafd; }
    .button-game { color: var(--purple); background: #f3efff; }
    .button-game:hover { background: #ebe4ff; }
    .button[hidden] { display: none; }
    .status { min-height: 21px; margin: 14px 0 0; color: var(--pink-dark); font-size: 12px; }

    .footer {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 22px;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 560px) {
      body { padding: 18px 14px 32px; }
      .topbar { margin-bottom: 39px; }
      .top-note { max-width: 145px; text-align: left; line-height: 1.5; }
      .intro p { max-width: 330px; margin-inline: auto; font-size: 14px; }
      .categories { padding: 21px 18px 19px; }
      .section-heading { align-items: flex-start; flex-direction: column; gap: 5px; }
      .question-area { padding: 29px 17px 23px; }
      .question { min-height: 118px; }
      .button { flex: 1 1 145px; }
      .intro-stats { gap: 6px; }
      .intro-stat { padding: 7px 9px; font-size: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">♡</span>
        <span class="brand-name">بيننا</span>
      </div>
      <span class="top-note">لحظات حلوة تبدأ بسؤال 💌</span>
    </header>

    <section class="intro" aria-labelledby="title">
      <div class="eyebrow"><span aria-hidden="true">✦</span> لعبة أسئلة للكابلز</div>
      <h1 id="title">خلّوا الكلام يقربكم 💗</h1>
      <p>اختاروا تصنيف، اسحبوا سؤال، وخدوا وقتكم في الإجابة.</p>
      <div class="intro-stats" aria-label="معلومات اللعبة">
        <span class="intro-stat"><strong id="total-count"></strong> سؤال متنوع</span>
        <span class="intro-stat"><strong>٤</strong> تصنيفات</span>
        <span class="intro-stat">💌 العبوا على راحتكم</span>
      </div>
    </section>

    <section class="game" aria-label="لعبة الأسئلة">
      <div class="categories">
        <div class="section-heading">
          <h2>نبدأ منين؟</h2>
          <span>اختاروا مودكم النهارده</span>
        </div>
        <div class="chips" id="categories" role="group" aria-label="تصنيفات الأسئلة"></div>
      </div>

      <div class="question-area" aria-live="polite">
        <div class="question-meta">
          <span class="category-label" id="category-label"></span>
          <span class="progress" id="progress"></span>
        </div>
        <div class="heart" aria-hidden="true">♡</div>
        <p class="question" id="question"></p>
        <p class="prompt" id="prompt">مفيش إجابة صح أو غلط — اسمعوا بعض وبس.</p>
        <div class="actions">
          <button class="button button-primary" id="next-button" type="button">
            <span aria-hidden="true">↻</span> سؤال تاني
          </button>
          <button class="button button-secondary" id="share-button" type="button" aria-label="ابعت السؤال على واتساب">
            <span aria-hidden="true">↗</span> ابعت السؤال
          </button>
          <button class="button button-game" id="round-button" type="button">
            <span aria-hidden="true">✦</span> ابدأوا جولة ٥ أسئلة
          </button>
        </div>
        <p class="status" id="status" role="status"></p>
      </div>
    </section>

    <footer class="footer"><span aria-hidden="true">♡</span> معمولة عشان وقتكم سوا يبقى أحلى</footer>
  </main>

        "إيه موقف من بداياتنا لسه بيخليك تبتسم؟",

        "إيه مكان أول مرة اتكلمنا فيه بجد؟",
        "إيه جملة قلتها لك ولسه بتستخدمها أو تفتكرها؟",
        "إيه مرة ساعدتك فيها وحسيت إن ده فرق معاك؟",
        "إيه تحدي صغير واجهناه في بداية علاقتنا؟",
        "إيه حاجة كنت فاكرها عني وطلعت مختلفة؟",
        "إيه أول أكلة أكلناها سوا؟",
        "إيه مناسبة نسينا نخططلها كويس وعدت بشكل لطيف؟",
        "إيه شخص عرفنا على بعض أو قرّبنا؟",
        "إيه موقف خلّاك تحس إني بعرف أقرأك؟",
        "إيه حاجة جديدة جربناها لأول مرة مع بعض؟",
        "إيه يوم قضيناه من غير خطة وكان من أحلى أيامنا؟",
        "إيه تفصيلة من أول مكالمة بينا مش ناسيها؟",
        "إيه ذكرى من مكان زرناه بتحب تحكيها؟",
        "إيه موقف حسيت فيه إن علاقتنا بقت أعمق؟",
        "إيه أول حاجة ضحكتك في شخصيتي؟",
        "إيه عادة كانت عندنا زمان واتغيرت دلوقتي؟",
        "إيه وقت صعب عدى وبقيت شايفه بشكل مختلف؟",
        "إيه إنجاز حققته وكنت أنا أول شخص حكيتله؟",
        "إيه رسالة أو مكالمة جت في وقت كنت محتاجها؟",
        "إيه موقف اتعلمنا منه نعتذر لبعض؟",
        "إيه أجمل صباح فاكره قضيناه سوا؟",
        "إيه مكان زرناه بالصدفة وبقى له معنى؟",
        "إيه تفصيلة من أول هدية بينا لسه فاكرها؟",
        "إيه مرة فاجأتك فيها من غير ما أخطط؟",
        "إيه يوم احتفلنا فيه بطريقة مختلفة عن كل مرة؟",
        "إيه أكتر حكاية بتحب تسمعها مني عن طفولتي؟",
        "إيه حاجة كنت بتحب تعملها لوحدك وبقيت تحب تشاركني فيها؟",
        "إيه أول موقف حسيت فيه إنك تقدر تعتمد عليّ؟",
        "إيه لحظة اتكلمنا فيها لحد ما الوقت جري؟",
        "إيه خروجة كان فيها تفصيل صغير مميز بالنسبالك؟",
        "إيه حاجة من أول فترة بينا نفسك نعملها تاني؟",
        "إيه موقف اختبر صبرنا ونجحنا نعديه؟",
        "إيه ذكرى مرتبطة بريحة أو طقس معين؟",
        "إيه وقت حسيت فيه إني دعمت حلمك؟",
        "إيه أول مرة اختلفنا فيها واتعلمنا نتفاهم إزاي؟",
        "إيه مناسبة بسيطة احتفلنا بيها وكانت مؤثرة؟",
        "إيه صورة أو فيديو لينا كل ما تشوفه تضحك؟",
        "إيه أكتر مكان مشينا فيه سوا وبتفتكره؟",
        "إيه أول حاجة عملناها سوا في عطلة؟",
        "إيه مجاملة سمعتها مني في وقت كنت محتاجها؟",
        "إيه مرة حسيت فيها إني فاجأتك بفهمي ليك؟",
        "إيه ذكرى بتحبها رغم إنها ما كانتش مثالية؟",
        "إيه أول صفة اكتشفتها فيّ بعد ما قربنا؟",
        "إيه قرار قديم أخدناه سوا ولسه مبسوطين بيه؟",
        "إيه موقف عرفك حاجة جديدة عن طريقتي في الحب؟",
        "إيه أكتر لحظة حسيت فيها بالفريق بينا؟",
        "إيه موضوع كنا بنتكلم فيه كتير في أول العلاقة؟",
        "إيه هدية بسيطة وصلتك مني في وقت مناسب؟",
        "إيه مشوار عادي اتحول لمغامرة صغيرة؟",
        "إيه مرة ضحكنا فيها لدرجة إننا ما عرفناش نكمل كلام؟",
        "إيه ذكرى مرتبطة بمكان بنعدي عليه كتير؟",
        "إيه أول مناسبة قابلت فيها حد قريب مني؟",
        "إيه تفصيلة من رحلة كانت متعبة بس تستاهل؟",
        "إيه موقف حسيت فيه إني شجعتك تعمل حاجة كنت متردد فيها؟",
        "إيه عادة جميلة بدأت بينا من غير ما نتفق عليها؟",
        "إيه يوم كان بسيط لكنه خلاك تحس بالامتنان؟",
        "إيه حاجة كنت بتحبها في بداية علاقتنا ولسه بتحبها؟",
        "إيه حكاية بينا تحب تفضل سر لطيف خاص بيننا؟",
        "إيه لحظة اكتشفت فيها إننا بنواجه الصعب سوا؟",
        "إيه موقف اتعلمنا فيه ندي بعض فرصة تانية؟",
        "إيه شيء اتغير للأحسن في حياتك من وقت ما عرفنا بعض؟"
      ]
    };

    const categoryNames = ["الكل", ...Object.keys(questions)];
    const totalQuestionCount = Object.values(questions).reduce((total, items) => total + items.length, 0);
    const categoryContainer = document.getElementById("categories");
    const categoryLabel = document.getElementById("category-label");
    const questionElement = document.getElementById("question");
    const progressElement = document.getElementById("progress");
    const promptElement = document.getElementById("prompt");
    const statusElement = document.getElementById("status");
    const roundButton = document.getElementById("round-button");
    let selectedCategory = "الكل";
    let currentQuestion = "";
    let roundQuestions = [];
    let roundIndex = -1;
    document.getElementById("total-count").textContent = formatNumber(totalQuestionCount);

    function randomItem(items) {
      return items[Math.floor(Math.random() * items.length)];
    }

    function getAvailableQuestions() {
      if (selectedCategory !== "الكل") {
        return questions[selectedCategory].map((text) => ({ text, category: selectedCategory }));
      }
      return Object.entries(questions).flatMap(([category, items]) =>
        items.map((text) => ({ text, category }))
      );
    }

    function renderCategories() {
      categoryContainer.replaceChildren();
      categoryNames.forEach((category) => {
        const button = document.createElement("button");
        button.className = "chip";
        button.type = "button";
        const label = document.createElement("span");
        const count = document.createElement("span");
        label.textContent = category;
        count.className = "chip-count";
        count.textContent = formatNumber(
          category === "الكل" ? totalQuestionCount : questions[category].length
        );
        button.append(label, count);
        button.setAttribute("aria-pressed", String(category === selectedCategory));
        button.addEventListener("click", () => {
          selectedCategory = category;
          roundQuestions = [];
          roundIndex = -1;
          roundButton.textContent = "✦ ابدأوا جولة ٥ أسئلة";
          promptElement.textContent = "مفيش إجابة صح أو غلط — اسمعوا بعض وبس.";
          statusElement.textContent = "";
          renderCategories();
          showRandomQuestion();
        });
        categoryContainer.append(button);
      });
    }

    function displayQuestion(item, progressText = "") {
      currentQuestion = item.text;
      questionElement.textContent = item.text;
      categoryLabel.textContent = item.category;
      progressElement.textContent = progressText;
      statusElement.textContent = "";
    }

    function formatNumber(number) {
      return new Intl.NumberFormat("ar-EG").format(number);
    }

    function showRandomQuestion() {
      const available = getAvailableQuestions();
      let item = randomItem(available);
      if (available.length > 1) {
        while (item.text === currentQuestion) item = randomItem(available);
      }
      displayQuestion(item);
      const url = new URL(window.location.href);
      url.searchParams.delete("q");
      window.history.replaceState({}, "", url);
    }

    function startRound() {
      if (roundIndex >= 0 && roundIndex === roundQuestions.length - 1) {
        roundQuestions = [];
        roundIndex = -1;
      }
      const available = getAvailableQuestions();
      for (let i = available.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [available[i], available[j]] = [available[j], available[i]];
      }
      roundQuestions = available.slice(0, 5);
      roundIndex = 0;
      promptElement.textContent = "جاوبوا بالتبادل وخدوا وقتكم مع كل سؤال 💕";
      roundButton.textContent = "السؤال التالي في الجولة";
      displayQuestion(roundQuestions[roundIndex], `${formatNumber(roundIndex + 1)} / ${formatNumber(roundQuestions.length)}`);
    }

    function nextQuestion() {
      if (roundIndex >= 0 && roundIndex < roundQuestions.length - 1) {
        roundIndex += 1;
        displayQuestion(roundQuestions[roundIndex], `${formatNumber(roundIndex + 1)} / ${formatNumber(roundQuestions.length)}`);
        return;
      }
      if (roundIndex >= 0 && roundIndex === roundQuestions.length - 1) {
        roundIndex = -1;
        roundQuestions = [];
        roundButton.textContent = "✦ ابدأوا جولة ٥ أسئلة";
        progressElement.textContent = "";
        questionElement.textContent = "كده خلّصتوا الجولة! 💗";
        categoryLabel.textContent = "برافو عليكم";
        promptElement.textContent = "تحبوا تبدأوا جولة جديدة ولا تكملوا أسئلة عشوائية؟";
        return;
      }
      showRandomQuestion();
    }

    async function shareQuestion() {
      const isLocalFile = window.location.protocol === "file:";
      const url = new URL(window.location.href);
      url.searchParams.set("q", currentQuestion);
      const message = isLocalFile
        ? currentQuestion
        : `${currentQuestion}\n\nالعبوا معايا: ${url.href}`;
      const shareData = { title: "سؤال من لعبة بيننا", text: message };
      try {
        if (navigator.share) {
          await navigator.share(shareData);
          statusElement.textContent = "اختار التطبيق أو الشخص اللي هتبعتله السؤال 💌";
        } else {
          const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(message)}`;
          const shareWindow = window.open(whatsappUrl, "_blank");
          if (shareWindow) {
            shareWindow.opener = null;
            statusElement.textContent = "واتساب اتفتح — اختار الشخص واضغط إرسال 💌";
            return;
          }
          await copyShareMessage(message);
          statusElement.textContent = "انسخنا السؤال — ابعته في واتساب أو أي تطبيق تاني 💌";
        }
      } catch (error) {
        if (error.name !== "AbortError") {
          statusElement.textContent = "تعذرت المشاركة. جرّب الضغط على الزر مرة تانية.";
        }
      }
    }

    async function copyShareMessage(message) {
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(message);
          return;
        } catch {
          // Fall back when clipboard permission is unavailable in the current browser.
        }
      }
      const textArea = document.createElement("textarea");
      textArea.value = message;
      textArea.setAttribute("readonly", "");
      textArea.style.position = "fixed";
      textArea.style.opacity = "0";
      document.body.append(textArea);
      textArea.select();
      const copied = document.execCommand("copy");
      textArea.remove();
      if (!copied) window.prompt("انسخ السؤال وابعته:", message);
    }

    roundButton.addEventListener("click", () => {
      if (roundIndex >= 0) nextQuestion();
      else startRound();
    });
    document.getElementById("next-button").addEventListener("click", nextQuestion);
    document.getElementById("share-button").addEventListener("click", shareQuestion);

    renderCategories();
    const sharedQuestion = new URLSearchParams(window.location.search).get("q");
    if (sharedQuestion) {
      const match = Object.entries(questions).find(([, items]) => items.includes(sharedQuestion));
      displayQuestion({
        text: sharedQuestion,
        category: match ? match[0] : "سؤال متشارك"
      });
    } else {
      showRandomQuestion();
    }
  </script>
